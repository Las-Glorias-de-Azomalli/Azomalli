services:
  db:
    image: postgres:16-alpine
    container_name: azomalli_e2e_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: azomalli_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azomalli_e2e"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azomalli_e2e_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/azomalli_e2e
      SECRET_KEY: e2e_secret_key_ci_123
      PORT: 5000
    command: >
      sh -c "alembic upgrade head && python seed.py && gunicorn --bind 0.0.0.0:5000 --workers 2 run:app"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/api/products || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azomalli_e2e_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_BASE_URL: http://backend:5000
      PORT: 3000
      HOST: 0.0.0.0
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      WDS_SOCKET_PORT: "0"
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  e2e_runner:
    build:
      context: ./tests_e2e
      dockerfile: Dockerfile
    container_name: azomalli_e2e_runner
    ipc: host
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      FRONTEND_URL: http://frontend:3000
      CI: "true"
