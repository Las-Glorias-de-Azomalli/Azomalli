services:
  # ── Backend API (Flask) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: azomalli_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:-dev_azomalli_super_secret_key_123}
      FLASK_APP: run.py
      FLASK_DEBUG: 1
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/__pycache__

  # ── Frontend SPA (React) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: azomalli_frontend
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
